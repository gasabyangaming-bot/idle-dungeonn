<style>
:root{--bg:#0d0a12;--bg2:#15101c;--panel:#1b1525;--panel2:#241c31;--line:#3a2d4d;--txt:#e9dfc9;--dim:#9a8fa8;--gold:#d9a94a;--red:#e0534f;--green:#5cc16a;
--blue:#4aa3ff;--purple:#b672ff;--legend:#ffc233;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;touch-action:manipulation;overscroll-behavior:none}
#root{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:radial-gradient(circle at 50% -10%,#241838 0,var(--bg) 55%)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px}
#hdr{padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hname{font-family:Georgia,serif;font-size:17px;color:var(--gold)}
.hgold{font-weight:700;color:var(--legend)}
.bar{height:10px;border-radius:6px;background:#0a070e;border:1px solid var(--line);overflow:hidden;margin:5px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7b4fd1,#c58bff);width:0}
.bar.run>i{background:linear-gradient(90deg,#b8862b,#ffd36b)}
.bar.life>i{background:linear-gradient(90deg,#a02b2b,#e0534f)}
.tick{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 18px}
#tabs{flex:none;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
#tabs button{flex:1;min-width:0;min-height:58px;background:none;border:0;color:var(--dim);font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
#tabs button b{font-size:19px;font-family:Georgia,serif;font-weight:700}
#tabs button.on{color:var(--gold);background:linear-gradient(#2a1f3a,#1b1525);box-shadow:inset 0 2px 0 var(--gold)}
#tabs .dot{position:absolute;top:6px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h3{font-size:16px;color:var(--gold);margin-bottom:6px}
.card h4{margin:10px 0 4px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 14px;border-radius:9px;border:1px solid #6a4f23;background:linear-gradient(#4a3516,#2e2110);color:var(--legend);font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;text-align:center}
.btn:active{filter:brightness(1.3)}
.btn.sec{border-color:var(--line);background:var(--panel2);color:var(--txt)}
.btn.danger{border-color:#7a2a2a;background:#3a1717;color:#ff9a96}
.btn.good{border-color:#2f6a3a;background:#173a1f;color:#8ee59a}
.btn.sm{min-height:40px;padding:6px 11px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn[disabled],.btn.off{opacity:.4;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.btns>.btn{flex:1}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .btn{flex:1;min-height:42px;font-size:14px}
.seg .btn.sel{background:linear-gradient(#5a3f14,#3a2810);color:#ffe29a;border-color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid #2a2136}
.row:last-child{border-bottom:0}
.row span{color:var(--dim)}.row b{color:var(--txt);text-align:right}
.row.mute{opacity:.45}
.row small{display:block;color:var(--dim);font-weight:400}
.dim{color:var(--dim)}.sm{font-size:13px}.xs{font-size:12px}
.up{color:var(--green);font-style:normal}.dn{color:var(--red);font-style:normal}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid}
.r-easy{color:#7fe08c;border-color:#2f6a3a;background:#12301a}.r-fair{color:#e8d56a;border-color:#6d6320;background:#2f2b10}
.r-risky{color:#ffa65a;border-color:#7a4a1f;background:#33200f}.r-deadly{color:#ff7a76;border-color:#7a2a2a;background:#3a1717}
.lock{opacity:.55}

/* Idle Dungeon - game engine (no DOM). Works in browser (window.Game) and node (module.exports). */
(function (root) {
'use strict';
const G = {};
let rng = Math.random;
G.setRng = f => { rng = f; };
const rnd = () => rng();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(rnd() * a.length)];

/* ---------------- Stats ---------------- */
const STATS = {
  str: { name: 'Strength', flat: 1 }, dex: { name: 'Dexterity', flat: 1 },
  int: { name: 'Intelligence', flat: 1 }, vit: { name: 'Vitality', flat: 1 },
  life: { name: 'Maximum Life', flat: 1 }, armor: { name: 'Armor', flat: 1 },
  ap: { name: 'Attack Power', flat: 1 }, sp: { name: 'Spell Power', flat: 1 },
  physPct: { name: 'Physical Damage', pct: 1 }, magPct: { name: 'Magic Damage', pct: 1 },
  minionPct: { name: 'Minion Damage', pct: 1 }, allDmg: { name: 'All Damage', pct: 1 },
  critChance: { name: 'Critical Chance', pct: 1 }, critDmg: { name: 'Critical Damage', pct: 1 },

/* ---------- helpers ---------- */
const sv = (stat, v, signed) => G.fmtVal(stat, v, signed);
const statLine = l => `${S_[l.stat].name} ${sv(l.stat, l.val, true)}`;
const rc = r => 'c-' + r;
const RN = r => G.RARITIES[r].name;
// Rarity pill shown next to EVERY item name (bag, equipped, modal, drops, compare, away summary): Blue / Purple / Gold / Overwhelming Gold
const rtag = r => `<span class="rtag t-${r}">${r === 'mythic' ? 'OVERWHELMING GOLD' : RN(r).toUpperCase()}</span>`;
const buffTag = r => `<span class="rtag t-${r}">${RN(r).toUpperCase()}</span>`;
// "+N" enhancement badge: shown on EVERY item display (+0 included in tooltips / compare)
const upTag = (it, always) => (it.up || always) ? `<b class="upb u${Math.min(4, Math.floor((it.up || 0) / 5))}">+${it.up || 0}</b>` : '';
function itemName(it) {
  return `<span class="${rc(it.rarity)}">${esc(it.name)}</span>${upTag(it)}` + rtag(it.rarity) + (it.set ? '<span class="badge st">SET</span>' : '') + (it.ab ? '<span class="badge ab">★</span>' : '') + (it.lock ? '<span class="badge lk">LOCK</span>' : '');
}
const plainName = it => `${it.name}${it.up ? ' +' + it.up : ''}`;
const abilHTML = it => it.ab ? `<div class="abil"><b>★ ${esc(it.ab.n)}</b>: ${esc(G.abilText(it.ab))}</div>` : '';
const themeTag = it => it.th ? `<span class="th">${G.THEMES[it.th].n}</span>` : '';
function setHTML(it, worn) {
  if (!it.set) return '';
  const d = G.SET_DEF[it.set], si = G.setInfo(S).find(x => x.id === it.set), n = si ? si.n : 0;
  return `<div class="setb"><b>${esc(d.title)}</b> <span class="dim">(${n}/4 worn)</span><div class="${n >= 2 ? 'up' : 'dim'}">2 pieces: ${esc(G.setBonusText(d.b2))}</div><div class="${n >= 4 ? 'up' : 'dim'}">4 pieces: ${esc(G.setBonusText(d.b4))}</div></div>`;
}
function toast(msg, cls) {
  const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.innerHTML = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), cls === 'ss' ? 9000 : cls === 'mythic' ? 6000 : 3200);
  while ($('#toasts').children.length > 3) $('#toasts').firstChild.remove();
}
function feedPush(c, s) { feed.unshift({ c, s, t: Date.now() }); if (feed.length > 40) feed.pop(); const el = $('#tick'); if (el) el.innerHTML = `<span class="f-${c}">${esc(s)}</span>`; }
function persist() { try { G.save(localStorage, S); } catch (e) { console.warn(e); } }
const classInfo = () => G.CLASSES[S.cls];
const fmtLeft = s => G.fmtDur(s);
const dropLog = []; // recent notable drops this session: {it, t}
const bagHas = it => S.bag.includes(it) || S.equip[it.slot] === it;
// small "Compare" button for any item that sits in the bag (works from drop log, last run and away summary)
const cmpBtn = it => S.bag.includes(it) ? `<button class="btn sm cmpb" data-act="cmp" data-id="${it.id}">Compare</button>` : (S.equip[it.slot] === it ? '<span class="dim xs">equipped</span>' : '<span class="dim xs">sold</span>');

/* ---------- events from engine ---------- */
const ctx = {
  wantLog: true,
  on(type, d) {
    dirty = true;
    if (type === 'drop') {
      const ab = d.ab ? ` ★ ${d.ab.n}: ${G.abilText(d.ab)}` : '', src = d.src ? ` (from ${d.src})` : '';
      if (d.rarity === 'mythic') { feedPush('mythic', `Overwhelming Gold drop: ${d.name}!!!${ab}`); toast(`OVERWHELMING GOLD DROP!<br>${esc(d.name)}<br><span class="xs">★ ${esc(d.ab.n)}: ${esc(G.abilText(d.ab))}</span>`, 'mythic'); }
      else if (d.rarity === 'gold') { feedPush('gold', `Gold drop: ${d.name}${ab}`); toast(`<span class="c-gold">Gold item:</span> ${esc(d.name)}${d.ab ? `<br><span class="xs">★ ${esc(d.ab.n)}: ${esc(G.abilText(d.ab))}</span>` : ''}`); }
      else if (d.rarity === 'purple') feedPush('purple', `Purple drop: ${d.name}${src}`);
      if (d.rarity !== 'blue') { dropLog.unshift({ it: d, t: Date.now() }); if (dropLog.length > 25) dropLog.pop(); }
    } else if (type === 'consumable') { feedPush(d.r, `Found ${G.buffName(d.k, d.r)} (${RN(d.r)}) - see Inventory`); toast(`<span class="c-${d.r}">${RN(d.r)}</span> consumable: ${esc(G.buffName(d.k, d.r))}<br><span class="xs">Open Inventory to use it</span>`); }
    else if (type === 'spellbook') { feedPush('ss', `OTHERWORLDLY: you found ${d.name}!`); toast(`<span class="ssb">S++</span> OTHERWORLDLY DROP<br><b>📖 ${esc(d.name)}</b><br><span class="xs">Read it in Inventory › Other to unlock ${esc(G.SSK[S.cls].name)}</span>`, 'ss'); dropLog.unshift({ book: d, t: Date.now() }); if (dropLog.length > 25) dropLog.pop(); }
    else if (type === 'petunlock') { feedPush('me', `${d.name} joins you! (Pets tab)`); toast(`${d.icon} <b>${esc(d.name)}</b> joined your party!<br><span class="xs">Open the Pets tab</span>`); }
    else if (type === 'petlevel') { const P = G.PETS[d.pet]; feedPush('me', `${P.name} reached pet level ${d.lv}.`); if (d.lv % 5 === 0 || G.PET_EVO_LV.includes(d.lv)) toast(`${P.icon} ${esc(P.name)} is now level ${d.lv}${G.PET_EVO_LV.includes(d.lv) ? ' - can evolve!' : ''}`); }
    else if (type === 'buffEnd') { feedPush('sys', `${G.buffName(d.k, d.r)} has worn off.`); toast(`${esc(G.buffName(d.k, d.r))} has worn off`); }
    else if (type === 'equip') feedPush('me', `Auto-equipped ${plainName(d)}`);
    else if (type === 'level') { feedPush('me', `Level up! You are now level ${d}.`); toast(S.settings.autoAttr ? `Level up! Level ${d} (+1 Enhancing point, attribute points auto-spent)` : `Level up! Level ${d} (+1 Enhancing point, +${G.attrPtsForLevel(d)} attribute points)`); }
    else if (type === 'achv') { feedPush('me', `Achievement: ${d.n} (+${fmt(d.r)} gold)`); toast(`Achievement: ${esc(d.n)}`); }
    else if (type === 'advance') { feedPush('me', `Moved on to ${G.DUNGEONS[d].n}.`); toast(`Advancing to ${esc(G.DUNGEONS[d].n)}`); }
    else if (type === 'retreat') { feedPush('sys', `Too dangerous - retreated to ${G.DUNGEONS[d].n}.`); toast(`Retreated to ${esc(G.DUNGEONS[d].n)}`); }
    else if (type === 'runEnd') { if (!d.win) feedPush('sys', `Defeated in ${G.DUNGEONS[d.d].n}${d.hard ? ' (Hard)' : ''}.`); else if (d.bosses && d.bosses.length) feedPush('sys', `Slew ${d.bosses.map(b => b.name).join(' & ')}.`); }
  },
};

function buffBang() { const free = sl => !S.buffs[sl]; return S.inv.some(x => free(G.BUFFS[x.k].slot)); }
const bookPending = () => !!(S.sb && S.sb.found && !S.sb.read);

const petSP = () => G.PET_IDS.reduce((t, id) => t + (G.petHave(S, id) ? Math.max(0, G.petSpLeft(S.pets.d[id])) : 0), 0);
const CHIP = { phys: 'Phys', mag: 'Magic', minion: 'Minion', ward: 'DR', barrier: 'Shield' };
function buffChips() {

}
function renderTabs() {

/* ---------- HERO ---------- */
const rowS = (label, val, mute, sub) => `<div class="row${mute ? ' mute' : ''}"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><b>${val}</b></div>`;
/* attribute points card: base (total) like the rest of the sheet, plus allocation controls */

function attrCard(PF) {
  const c = classInfo(), pts = S.attrPts | 0, cost = G.attrRespecCost(S), spent = G.attrSpent(S), bd = G.ATTR_BUILD[S.cls];

  const btn = (a, n, lbl) => `<button class="btn sm ${pts >= (n === 'max' ? 1 : n) ? '' : 'off'}" data-act="attr" data-id="${a}:${n}">${lbl}</button>`;
  return `<div class="card attr${pts ? ' has' : ''}"><h3>Attributes</h3>
   <div class="row"><span><b>Unspent attribute points</b><small>+${G.ATTR_PTS_PER_LEVEL} per level (+2 bonus every 10th level). Separate from Enhancing points and Skills.</small></span><b class="${pts ? 'c-gold' : 'dim'}" id="attrPts">${pts}</b></div>
   ${pts ? `<div class="hint" style="margin:6px 0">You have <b>${pts}</b> attribute point${pts === 1 ? '' : 's'} to spend! ${c.name}s do best with ${best}.</div>` : ''}
   ${G.ATTRS.map(a => `<div class="row attrrow"><span>${S_[a].name}: ${PF(a)}<small>Points ${S.attr[a] | 0} · Training +${S.train[a] * 2} · each point ${ATTR_EFFECT[a]}</small></span><span class="abtns">${btn(a, 1, '+1')}${btn(a, 5, '+5')}${btn(a, 'max', '+max')}</span></div>`).join('')}
   <div class="btns" style="margin-top:8px"><button class="btn sm ${pts ? '' : 'off'}" data-act="attrsuggest">Suggested build</button>
    <button class="btn sm ${spent && S.gold >= cost ? 'sec' : 'off'}" data-act="attrrespec">Respec points${spent ? ` (${cost ? fmt(cost) + 'g' : 'free'})` : ''}</button>
    <button class="btn sm ${S.settings.autoAttr ? 'good' : 'sec'}" data-act="toggle" data-id="autoAttr">Auto-spend: ${S.settings.autoAttr ? 'ON' : 'OFF'}</button></div>
   <div class="xs dim" style="margin-top:6px">Points apply instantly. Respec refunds all spent points (gold cost grows with level). Auto-spend follows the suggested ${c.name} build whenever you level up - handy while away. Gold training in Upgrades stacks on top.</div>
  </div>`;
}
function renderHero() {

/* ---------- Pets tab ---------- */
let petSel = null, petSub = 'ov';
const PSUBS = [['ov', 'Overview'], ['sk', 'Skills'], ['tree', 'Tree'], ['up', 'Upgrades']];

/* ---------- INVENTORY ---------- */
function buffCard(slot) {
  const b = S.buffs[slot], title = G.BUFF_SLOTS[slot];
  if (!b) return `<div class="buffcard empty"><div class="bt">${title}</div><div class="sm dim">Empty slot. ${slot === 'damage' ? 'Use an Elixir below for +% Physical / Magic / Minion Damage.' : 'Use a Ward or Barrier below for Damage Reduction or an absorb shield.'}</div></div>`;
  return `<div class="buffcard t-${b.r}"><div class="bt">${title} ${buffTag(b.r)}</div>
   <div class="nm">${esc(G.buffName(b.k, b.r))}</div><div class="sm up">${esc(G.buffText(b.k, b.r))}</div>
   <div class="row"><span>Time left</span><b data-buff="${slot}">${G.fmtDur(b.left)}</b></div>
   <div class="bar"><i data-bbar="${slot}" style="width:${Math.max(0, Math.min(100, b.left / b.total * 100))}%"></i></div></div>`;
}
function renderInventory() {
  const sub = S.settings.invSub || 'gear', hasBang = buffBang(), nb = G.invCount(S) + 0;
  const b = (id, lbl, cnt, bang) => `<button class="btn ${sub === id ? 'sel' : 'sec'}" data-act="isub" data-id="${id}">${lbl} <span class="cnt2">${cnt}</span>${bang ? '<span class="dot2">!</span>' : ''}</button>`;
  const seg = `<div class="seg isub">${b('gear', 'Gear', `${S.bag.length}/${S.bagCap}`, 0)}${b('buffs', 'Buffs', nb, hasBang)}${b('other', 'Other', otherCount(), bookPending())}</div>`;
  return seg + (sub === 'buffs' ? renderBuffs() : sub === 'other' ? renderOther() : renderBag());
}
const otherCount = () => bookPending() ? 1 : 0;
function bookCard() {

  if (S.sb.found) return `<div class="card book"><h3>📖 ${esc(bk.name)} <span class="ssb">S++</span></h3><div class="sm"><i>${esc(bk.lore)}</i></div><div class="xs dim" style="margin:6px 0">Reading it permanently unlocks <b class="c-ss">${esc(d.name)}</b>, an Otherworldly S++ skill. The book is consumed.</div><div class="btns"><button class="btn" data-act="readbook">Read the book</button></div></div>`;
  return `<div class="card book none"><h3>📖 Spellbook</h3><div class="xs dim">Nothing yet. Your class has a single lost spellbook that can drop from a Final Boss or Champion (about 1 in ${fmt(Math.round(1 / G.spellbookRunChance(false, 0.3)))} Normal runs, about 1 in ${fmt(Math.round(1 / G.spellbookRunChance(true, 0.3)))} Hard runs, no pity).</div></div>`;
}
function renderOther() {

   <div class="seg" style="margin-top:8px;flex-wrap:wrap">

   ${f.upgrades ? '' : `<button class="btn sm ${S.gold >= G.FILTER_COST.upgrades ? '' : 'off'}" data-act="bfilt" data-id="upgrades">Unlock Non-upgrades (${fmt(G.FILTER_COST.upgrades)}g)</button>`}</div></div>`;

function renderBuffs() {
  let html = `<div class="card"><h3>Active Buffs</h3><div class="xs dim">Buffs last 24 hours of real time and keep ticking down while the game is closed.</div></div>${buffCard('damage')}${buffCard('shield')}`;

  const rk = x => G.RARITIES[x.r].rank;
  const list = S.inv.slice().sort((a, b) => (G.BUFFS[a.k].slot === G.BUFFS[b.k].slot ? 0 : G.BUFFS[a.k].slot === 'damage' ? -1 : 1) || rk(b) - rk(a));
  if (!list.length) html += `<div class="empty">Nothing here yet. Keep farming dungeons - buffs drop from runs.</div>`;
  for (const x of list) {
    const d = G.BUFFS[x.k], info = G.buffUseInfo(S, x.k, x.r);
    const lbl = info.mode === 'blocked' ? `Weaker than active` : info.mode === 'refresh' ? 'Refresh to 24h' : info.mode === 'replace' ? 'Use (replaces active)' : 'Use (24h)';
    const rel = (x.k === 'phys' || x.k === 'mag' || x.k === 'minion') ? (x.k === 'phys' ? S.cls === 'warrior' : x.k === 'mag' ? S.cls === 'mage' : S.cls === 'summoner') : true;
    html += `<div class="invitem t-${x.r}"><div class="nm"><span class="c-${x.r}">${esc(G.buffName(x.k, x.r))}</span>${buffTag(x.r)}<span class="cnt">x${x.n}</span></div>
     <div class="sm up">${esc(G.buffText(x.k, x.r))}</div>
     <div class="xs dim">${G.BUFF_SLOTS[d.slot]} · lasts 24h${rel ? '' : ' · <span class="dn">not your main damage type</span>'}</div>
     <div class="btns"><button class="btn sm ${info.mode === 'blocked' ? 'off' : info.mode === 'replace' ? '' : 'good'}" data-act="usebuff" data-id="${x.k}:${x.r}">${lbl}</button></div></div>`;
  }
  html += `<div class="card"><h3>How buffs work</h3>
   <div class="xs">• Two slots: <b>one Damage buff</b> and <b>one Shield buff</b> can be active together.</div>
   <div class="xs">• Re-using the <b>same</b> buff refreshes its timer to 24h (no stacking).</div>
   <div class="xs">• A <b>higher rarity</b> buff (or a different type of the same rarity) replaces the active one.</div>

   <div class="xs">• Barrier is an absorb shield equal to a % of Max Life that renews every dungeon run. Ward adds Damage Reduction (total capped at 75%).</div>
   <div class="xs">• Buffs apply to the Stat Sheet and to offline progress while they last.</div>
   <div class="xs dim">Damage: Lesser +15% / Greater +30% / Supreme +55%. Ward: +5 / +9 / +14%. Barrier: 25 / 50 / 90% of Max Life.</div></div>`;
  return html;
}

   <div class="xs dim">Enhancement is permanent for that item and carries through equip / unequip. Selling returns 35% of the gold spent. Transfer moves a high + from another item of the same slot for 30% of the difference.</div>`;

       ${sum.firstClears.length ? `<div class="row"><span>First clears</span><b>${sum.firstClears.map(esc).join(', ')}</b></div>` : ''}
       ${(sum.moves || []).map(m => `<div class="sm dim">• ${esc(m)}</div>`).join('')}${(sum.achv || []).map(m => `<div class="sm c-gold">★ ${esc(m)}</div>`).join('')}`;
      if (sum.best.length) h += `<h4 style="margin:10px 0 4px;color:var(--dim)">Best finds</h4>` + sum.best.slice(-6).map(i => `<div class="dr"><span class="sm">${itemName(i)} <span class="dim xs">${G.SLOT_NAME[i.slot]} ilvl ${i.ilvl}${i.src ? ' · ' + esc(i.src) : ''}</span>${i.ab ? `<div class="xs c-gold">★ ${esc(i.ab.n)}: ${esc(G.abilText(i.ab))}</div>` : ''}</span>${cmpBtn(i)}</div>`).join('');
    }
    return h + `<div class="btns"><button class="btn" data-act="closemodal">Continue</button></div></div>`;
  };
}

/* ---------- main render ---------- */
function render() {
  const v = $('#view'), sc = v.scrollTop;
  if (!S) { renderHeader(); renderTabs(); v.innerHTML = renderClassSelect(); return; }
  renderHeader(); renderTabs();
  let html;
  if (tab === 'hero') html = renderHero(); else if (tab === 'dungeon') html = renderDungeon(); else if (tab === 'gear') html = renderGear();
  else if (tab === 'pets') html = renderPets(); else if (tab === 'inv') html = renderInventory(); else if (tab === 'upgrades') html = renderUpgrades(); else html = renderMore();
  v.innerHTML = html; v.scrollTop = sc; dirty = false; lastRender = Date.now(); updateLive();
}
function go(t) { tab = t; $('#view').scrollTop = 0; render(); }
function showNotice() { if (S && S.notice) { const m = S.notice; S.notice = null; persist(); openModal(noticeModal(m)); } }

/* ---------- actions ---------- */
const A = {
  pick(id) { S = G.newState(id); G.startRun(S, 0, ctx); tab = 'hero'; heroSub = 'stats'; persist(); feedPush('sys', `A new ${G.CLASSES[id].name} begins their journey.`); render(); },
  usebuff(id) { const [k, r] = id.split(':'); const info = G.buffUseInfo(S, k, r); if (info.mode === 'blocked') { toast('A stronger buff is already active'); return; }
    if (info.mode === 'replace' && !confirm(`Replace ${G.buffName(info.cur.k, info.cur.r)} (${fmtLeft(info.cur.left)} left) with ${G.buffName(k, r)}?`)) return;
    const res = G.useConsumable(S, k, r); if (res.ok) { persist(); toast(`${esc(G.buffName(k, r))}: ${res.msg}`); } else toast(res.msg); render(); },
  tab(id) { go(id); }, hsub(id) { heroSub = id; render(); },
  sk_open(id) { skOpen[id] = !(id.startsWith('ss_') ? skOpen[id] !== false : skOpen[id]); render(); },
  readbook() { if (G.readSpellbook(S)) { const d = G.ssSkill(S); persist(); toast(`<span class="ssb">S++</span> <b>${esc(d.name)}</b> unlocked!<br><span class="xs">See Hero › Skills</span>`, 'ss'); feedPush('ss', `You read ${G.SPELLBOOKS[S.cls].name}. ${d.name} is yours!`); render(); } },
  sk_slot(i) { skSel = +i; render(); },
  sk_equip(id) { const n = G.skillSlots(S); const free = S.act.slots.findIndex((x, i) => !x && i < n); if (G.equipSkill(S, id, free >= 0 ? free : skSel)) render(); },
  sk_unequip(id) { if (G.unequipSkill(S, id)) render(); },
  sk_up(id) { if (G.upSkill(S, id)) render(); else toast('Not enough gold, or at max +'); },
  sk_morph(id) { const [sid, m] = id.split(':'); const had = S.act.morph[sid] != null; if (G.setMorph(S, sid, +m)) { toast(had ? 'Morph switched' : 'Morph chosen'); render(); } else toast('Not enough gold'); },
  skill(id) { if (G.buySkill(S, id)) render(); },
  psel(id) { petSel = id; render(); }, psub(id) { petSub = id; render(); },
  pactive(id) { if (G.petSetActive(S, id)) { toast(`${esc(G.petName(S, id))} is now your active pet`); render(); } },
  pnode(id) { const [pid, nid] = id.split(':'); if (G.petBuyNode(S, pid, nid)) render(); else toast('Cannot buy that node yet'); },
  preset(id) { if (confirm(`Reset ${G.petName(S, id)}'s tree for ${fmt(G.petResetCost(S.pets.d[id]))} gold?`)) { if (G.petResetTree(S, id)) render(); else toast('Not enough gold'); } },
  pup(id) { if (G.petUp(S, id)) render(); else toast('Not enough gold, or at max'); },
  pbond(id) { if (G.petBond(S, id)) render(); else toast('Not enough gold, or at max'); },
  pevo(id) { if (G.petEvolve(S, id)) { toast(`${esc(G.petName(S, id))} evolved!`); render(); } else toast('Needs more pet levels or gold'); },
  respec() { if (confirm(`Reset all Enhancing ranks for ${G.respecCost(S)} gold?`)) { if (G.respec(S)) render(); else toast('Not enough gold or nothing to reset'); } },
  dsel(id) { dSel = +id; dTab = (dTab === 'h' && G.hardUnlocked(S, +id)) ? 'h' : 'n'; render(); },
  dtab(id) { dTab = id; render(); },
  enter(id) { const [i, m] = String(id).split(':'), hard = m === 'h'; if (!G.isUnlocked(S, +i) || (hard && !G.hardUnlocked(S, +i))) return; G.startRun(S, +i, ctx, hard); toast(`Entering ${esc(G.DUNGEONS[+i].n)}${hard ? ' (Hard)' : ''}`); render(); },
  stop() { S.run = null; render(); },
  toggle(k) { S.settings[k] = !S.settings[k]; if (k === 'autoRepeat' && S.settings.autoRepeat && !S.run && S.dungeon.cur != null) G.startRun(S, S.dungeon.cur, ctx, S.dungeon.hard); render(); },
  view(id) { const it = findItem(id); if (it) openModal(() => itemModal(findItem(id) || it, false)); },
  cmp(id) { const it = findItem(id); if (it) openModal(cmpModal(+id)); else toast('That item is no longer in your bag'); },
  viewE(slot) { const it = S.equip[slot]; if (it) openModal(() => itemModal(S.equip[slot] || it, true)); },
  closemodal() { closeModal(); },
  equip(id) { const it = findItem(id); if (it && G.equipItem(S, it)) { closeModal(); render(); toast(`Equipped ${esc(plainName(it))}`); } },
  unequip(slot) { if (G.unequip(S, slot)) { closeModal(); render(); } else toast('Bag is full'); },
  sell(id) { const it = findItem(id); if (!it || it.lock || it.rarity === 'mythic') return; const g = G.sellItem(S, it); closeModal(); render(); toast(`Sold for ${fmt(g)} gold`); },
  upgrade(id) { const it = findAny(id); if (it && G.upgradeItem(S, it)) { toast(`${esc(it.name)} is now +${it.up}`); render(); refreshModal(); } else toast('Not enough gold'); },
  xfer(id) { const it = findAny(id); if (it && G.transferUp(S, it)) { toast(`Transferred +${it.up}`); render(); refreshModal(); } else toast('Not enough gold'); },
  lock(id) { const it = findAny(id); if (it) { it.lock = !it.lock; render(); refreshModal(); } },
  gsort(v) { gearSort = v; gearShown = PAGE; render(); }, gfilt(v) { gearFilter = v; gearShown = PAGE; render(); }, gslot(v) { gearSlot = v; gearShown = PAGE; render(); }, gmore() { gearShown += PAGE; render(); },
  isub(v) { S.settings.invSub = v; if (v === 'gear') gearShown = PAGE; render(); },
  sellblue() { const r = G.bulkSell(S, i => i.rarity === 'blue'); toast(`Sold ${r.n} items for ${fmt(r.g)} gold`); render(); },
  sellnon() { const r = G.bulkSell(S, i => i.rarity !== 'gold' && !G.isUpgrade(S, i)); toast(`Sold ${r.n} items for ${fmt(r.g)} gold`); render(); },
  equipbest() { let n = 0; for (let k = 0; k < 20; k++) { let best = null, bp = G.getStats(S).power * 1.0005; for (const it of S.bag) { const p = G.itemPower(S, it); if (p > bp) { bp = p; best = it; } } if (!best) break; G.equipItem(S, best); n++; } toast(n ? `Equipped ${n} upgrade${n > 1 ? 's' : ''}` : 'No upgrades in bag'); render(); },
  spendpts() { closeModal(); tab = 'hero'; heroSub = 'stats'; render(); },
  attr(v) { const [a, n] = v.split(':'); const r = G.allocAttr(S, a, n === 'max' ? 'max' : +n); if (r) { render(); } },
  attrsuggest() { if (G.autoSpendAttr(S)) { toast('Points spent on the suggested build'); render(); } },
  attrrespec() { const c = G.attrRespecCost(S); if (!G.attrSpent(S)) return; if (S.gold < c) { toast(`Need ${fmt(c)} gold to respec`); return; } if (c && !confirm(`Refund all spent attribute points for ${fmt(c)} gold?`)) return; if (G.respecAttr(S)) { toast('Attribute points refunded - spend them again'); render(); } },
  train(k) { if (G.buyTrain(S, k)) render(); }, boffline() { if (G.buyOffline(S)) render(); }, bbag() { if (G.buyBag(S)) render(); },
  asell(m) { S.settings.autoSell = m; render(); }, bfilt(k) { if (G.buyFilter(S, k)) render(); },
  export() { $('#saveBox').value = G.exportString(S); },
  download() { const b = new Blob([G.exportString(S)], { type: 'text/plain' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'idle-dungeon-save.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  copy() { const b = $('#saveBox'); if (!b.value) b.value = G.exportString(S); b.select(); try { navigator.clipboard.writeText(b.value); } catch (e) { document.execCommand('copy'); } toast('Copied'); },
  import() { const b = $('#saveBox'); try { const ns = G.importString(b.value); if (!confirm('Replace current progress with this save?')) return; S = ns; S.lastSeen = Date.now(); persist(); toast('Save imported'); render(); showNotice(); } catch (e) { toast('Invalid save code'); } },
  reset() { if (confirm('Delete ALL progress and start over? This cannot be undone.')) { localStorage.removeItem(G.SAVE_KEY); S = null; feed.length = 0; dropLog.length = 0; render(); } },
  install() { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } },
};
$('#root').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) { e.preventDefault(); A[b.dataset.act](b.dataset.id); } });
$('#modal').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && A[b.dataset.act]) A[b.dataset.act](b.dataset.id); else if (e.target.id === 'modal') closeModal(); });
document.addEventListener('pointerdown', () => { pointerDown = true; }); document.addEventListener('pointerup', () => { setTimeout(() => { pointerDown = false; }, 50); }); document.addEventListener('pointercancel', () => { pointerDown = false; });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });

/* ---------- loop ---------- */
function ensureRun() { if (S.run && S.run.res && !S.run.res.log) G.startRun(S, S.run.d, ctx, S.run.hard); }
function tick() {
  if (!S) return;
  const now = Date.now(), away = (now - S.lastSeen) / 1000;
  if (away > 45) {
    const sum = G.offline(S, now); ensureRun(); dirty = true;
    if ((sum.eff > 0 && !sum.idle) || (sum.idle && away > 600)) openModal(awayModal(sum));
    persist();
  } else {
    G.advance(S, Math.max(0, Math.min(away, 45)), ctx); S.lastSeen = now; ensureRun();
  }
  const g = $('#hGold'); if (g) g.textContent = fmt(S.gold) + ' gold';
  for (const el of document.querySelectorAll('[data-buff]')) { const b = S.buffs[el.dataset.buff]; if (b) el.textContent = G.fmtDur(b.left); }
  for (const el of document.querySelectorAll('[data-bbar]')) { const b = S.buffs[el.dataset.bbar]; if (b) el.style.width = Math.max(0, Math.min(100, b.left / b.total * 100)) + '%'; }
  if (dirty && !modalFn && !pointerDown && now - lastRender > 700) render();
  else if (dirty && modalFn && !pointerDown) renderHeader();
  else { updateLive(); const need = S.level >= G.MAX_LEVEL ? 1 : G.xpNext(S.level); const x = $('#hXp'); if (x) { x.style.width = (S.level >= G.MAX_LEVEL ? 100 : Math.min(100, S.xp / need * 100)) + '%'; $('#hXpT').textContent = 'XP ' + (S.level >= G.MAX_LEVEL ? 'MAX' : fmt(S.xp) + ' / ' + fmt(need)); } }
}
function boot() {
  S = G.load(localStorage);
  if (S) {
    const away = (Date.now() - S.lastSeen) / 1000;
    if (away > 20) { const sum = G.offline(S, Date.now()); ensureRun(); if ((sum.eff > 20 && !sum.idle) || (sum.idle && away > 600)) openModal(awayModal(sum)); }
    else { G.tickBuffs(S, away, {}); ensureRun(); }
    S.lastSeen = Date.now();
  }
  render();
  showNotice();
  setInterval(tick, 250);
  setInterval(() => { if (S) persist(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (document.hidden && S) persist(); else if (S) tick(); });
  window.addEventListener('pagehide', () => { if (S) persist(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__idle = { get S() { return S; }, G, render, tick, A, ctx };
boot();
})();

</script>
